[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docfence"
version = "0.1.0"
description = "Validate markdown spec docs with inline rules"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
docfence = "docfence:main"

[tool.setuptools]
py-modules = ["docfence"]
packages = ["core"]